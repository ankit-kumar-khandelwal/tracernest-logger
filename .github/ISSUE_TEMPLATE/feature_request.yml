name: Feature Request
description: Suggest an improvement
title: "[FEATURE]: "
labels: ["enhancement"]

body:
  - type: textarea
    attributes:
      label: Problem Statement
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behaviour
    validations:
      required: true