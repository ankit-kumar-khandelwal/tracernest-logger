name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Package
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # Note: The repository secret NPM_TOKEN is configured with npm's maximum 90-day
          # granular token validity and will expire on February 16, 2027.
          # Maintainers: Remember to regenerate and rotate this secret on npmjs.com before
          # that date to avoid deployment pipeline authentication failures.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
